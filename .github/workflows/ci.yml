name: CI

on:
  push:
  pull_request:

env:
  DOOM1_WAD: /usr/share/games/doom/doom1.wad
  DOOM1_SHA256: 1d7d43be501e67d927e415e0b8f3e29c3bf33075e859721816f652a526cac771
  CHOCOLATE_URL: https://www.chocolate-doom.org/downloads/3.0.1/chocolate-doom-3.0.1.tar.gz
  CHOCOLATE_SHA256: d435d6177423491d60be706da9f07d3ab4fabf3e077ec2a3fc216e394fcfc8c7
  CHOCOLATE: chocolate-doom-3.0.1/src/chocolate-doom
  STATCHECK_COMMIT: 0fbe718e3a5624b344e72f397669f50f26b1b668

jobs:
  femtowad:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/femtowad
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uv run ruff check
      - name: Format
        run: uv run ruff format --check
      - name: Types
        run: uv run mypy src tests
      - name: Tests
        run: uv run pytest

  build:
    runs-on: ubuntu-24.04
    env:
      CC: gcc -std=c11 -fno-short-enums -O2 -Wall -Wextra -Werror -Isrc
      SWITCHES: >-
        -DHIGH_DETAIL -DFLAT_WALL -DSMALL_TRIG -DW_FETCH -DNO_DEMOS -DLOW_MEMORY
        -DST_PARTIAL_REFRESH -DDISABLE_STATUS_BAR
        -DRANGE_CHECK -DINSTRUMENTED -DDEBUG -DONE_WALL_TEXTURE
    steps:
      - uses: actions/checkout@v5
      - name: Compile with every switch on
        run: for f in src/*.c; do $CC $SWITCHES -c "$f" -o /dev/null || exit 1; done

  demos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install doom1.wad, SDL, clang and gcc-multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y doom-wad-shareware libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev clang gcc-multilib
          echo "$DOOM1_SHA256  $DOOM1_WAD" | sha256sum -c
      - name: Build Chocolate Doom with the trace
        run: |
          curl -sSfL -o chocolate.tar.gz "$CHOCOLATE_URL"
          echo "$CHOCOLATE_SHA256  chocolate.tar.gz" | sha256sum -c
          tar xzf chocolate.tar.gz
          cd chocolate-doom-3.0.1
          patch -p1 < ../tests/chocolate/trace.patch
          ./configure --quiet
          make -j"$(nproc)" >/dev/null
      - name: builtin demos (DEMO1, DEMO2, DEMO3)
        run: python3 tests/run.py builtin "$CHOCOLATE" "$DOOM1_WAD"
      - name: Fetch statcheck
        run: |
          git init -q statcheck
          git -C statcheck remote add origin https://github.com/chocolate-doom/statcheck
          git -C statcheck sparse-checkout set --no-cone '/demos/doom/*/e1*/*.lmp'
          git -C statcheck fetch -q --depth 1 --filter=blob:none origin "$STATCHECK_COMMIT"
          git -C statcheck checkout -q FETCH_HEAD
      - name: statcheck demos
        run: python3 tests/run.py statcheck "$CHOCOLATE" "$DOOM1_WAD" statcheck

  embedded:
    runs-on: ubuntu-24.04
    env:
      CC: >-
        clang --target=arm-none-eabi -mcpu=cortex-m0 --sysroot=/usr/lib/arm-none-eabi
        -Os -std=c11 -fno-short-enums -Wall -Wextra -Werror -Isrc
    steps:
      - uses: actions/checkout@v5
      - name: Install clang and the newlib headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc-arm-none-eabi
      - name: Cross-compile
        run: for f in src/*.c; do $CC -c "$f" -o /dev/null || exit 1; done
